[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "official-job-discovery-runner"
version = "0.1.0"
description = "Privacy-safe, discovery-only official job collector"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
discovery-runner = "discovery_runner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["discovery_runner*"]
