name: Official public job harvest

on:
  push:
    branches: [main]
    paths: [control/canary.txt]
  workflow_dispatch:
    inputs:
      batch:
        description: Discovery window
        required: true
        type: choice
        options: [Morning, Afternoon, Evening]
  schedule:
    - cron: "50 6 * * *"
      timezone: America/New_York
    - cron: "10 7 * * *"
      timezone: America/New_York
    - cron: "30 7 * * *"
      timezone: America/New_York
    - cron: "50 13 * * *"
      timezone: America/New_York
    - cron: "10 14 * * *"
      timezone: America/New_York
    - cron: "30 14 * * *"
      timezone: America/New_York
    - cron: "50 16 * * *"
      timezone: America/New_York
    - cron: "10 17 * * *"
      timezone: America/New_York
    - cron: "30 17 * * *"
      timezone: America/New_York

permissions:
  actions: read
  contents: read

concurrency:
  group: public-harvest-${{ github.event_name }}-${{ github.event.schedule || inputs.batch }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check same-window READY state
        id: dedupe
        uses: actions/github-script@v7
        with:
          script: |
            const manual = `${{ inputs.batch }}`;
            const now = new Date();
            const date = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(now);
            const hour = Number(new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/New_York', hour: '2-digit', hour12: false
            }).format(now));
            const batch = manual || (hour < 12 ? 'Morning' : hour < 16 ? 'Afternoon' : 'Evening');
            const prefix = `ready-${batch}-${date}-`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            core.setOutput('batch', batch);
            core.setOutput('date', date);
            core.setOutput('skip', artifacts.some(item => !item.expired && item.name.startsWith(prefix)) ? 'true' : 'false');
      - uses: actions/checkout@v4
        if: steps.dedupe.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.dedupe.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and verify
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
          python scripts/privacy_scan.py .
      - name: Discover
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          mkdir -p output
          discovery-runner run-batch --sources sources/public_sources.json --artifact output/jobs.jsonl.gz --summary-file output/summary.json
          discovery-runner final-qa --artifact output/jobs.jsonl.gz --summary-file output/summary.json
      - name: Upload READY artifact
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ready-${{ steps.dedupe.outputs.batch }}-${{ steps.dedupe.outputs.date }}-${{ github.run_id }}
          path: output/
          retention-days: 1
          if-no-files-found: error
