name: Exact Workday freshness check

on:
  push:
    branches: [main]
    paths: [control/exact_workday_canary.txt]

permissions:
  actions: read
  contents: write

concurrency:
  group: exact-workday-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and verify
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
          python scripts/privacy_scan.py .
      - name: Discover exact Workday source and final QA
        run: |
          mkdir -p output
          discovery-runner run-batch --sources sources/exact_workday_source.json --artifact output/jobs.jsonl.gz --summary-file output/summary.json
          discovery-runner final-qa --artifact output/jobs.jsonl.gz --summary-file output/summary.json
      - name: Persist exact Workday READY payload
        shell: bash
        run: |
          mkdir -p control/exact-workday-latest
          cp output/jobs.jsonl.gz control/exact-workday-latest/jobs.jsonl.gz
          cp output/summary.json control/exact-workday-latest/summary.json
          python scripts/privacy_scan.py .
          git config user.name official-job-discovery-bot
          git config user.email actions@users.noreply.github.com
          git add control/exact-workday-latest/jobs.jsonl.gz control/exact-workday-latest/summary.json
          git commit -m "Update exact Workday freshness payload"
          git pull --rebase origin main
          git push origin HEAD:main
